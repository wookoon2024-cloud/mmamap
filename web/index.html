<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>군필지도</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="map"></div>

    <div id="brandLogo" class="brandLogo">
      <img src="./img/logo.png" alt="logo" />
    </div>

    <nav id="hubNav" class="hubNav" aria-label="서비스 메뉴"></nav>
    <div id="hubMega" class="hubMega hidden" aria-label="서비스 상세 메뉴"></div>

    <div id="hubModalBackdrop" class="hubModalBackdrop hidden" aria-hidden="true"></div>
    <aside id="hubPanel" class="hubPanel hidden" aria-live="polite"></aside>

    <div id="introBackdrop" class="introBackdrop hidden" aria-hidden="true"></div>
    <section id="introPopup" class="introPopup hidden" role="dialog" aria-modal="true" aria-labelledby="introTitle">
      <button id="introCloseBtn" class="introCloseBtn" type="button" aria-label="소개 팝업 닫기">×</button>
      <div class="introPopupHead">
        <h2 id="introTitle">군필지도 소개</h2>
      </div>
      <div class="introPopupBody">
        <p>군필지도는 병역이행자와 병역명문가를 위한 혜택 정보를 한 화면에서 찾을 수 있도록 만든 통합 안내 서비스입니다.</p>
        <p>나라사랑가게, 병역명문가가게, 카드/금융 안내와 공유게시판을 통해 이용 정보와 참여 흐름을 쉽게 확인할 수 있습니다.</p>
      </div>
      <div class="introPopupFoot">
        <label class="introNeverLabel">
          <input id="introNeverCheck" type="checkbox" />
          <span>다시보지않기</span>
        </label>
        <button id="introConfirmBtn" class="introConfirmBtn" type="button">확인</button>
      </div>
    </section>

    <div class="legendBar">
      <div class="legendTabRow">
        <button id="legendTabCategory" class="legendTabBtn active" type="button">상점 분류</button>
        <button id="legendTabAudience" class="legendTabBtn" type="button">대상자 구분</button>
        <div class="legendRegionWrap">
          <label for="regionSelect" class="legendRegionLabel">지역</label>
          <select id="regionSelect" class="legendRegionSelect" aria-label="지역 선택">
            <option value="">전체지역</option>
          </select>
        </div>
      </div>
      <div id="categoryLegend" class="categoryLegend"></div>
      <div id="audienceLegend" class="audienceLegend hiddenLegend"></div>
    </div>

    <div class="profileMenuWrap">
      <div id="sourceStatsBox" class="sourceStatsBox">
        <div class="sourceStatsTitle">데이터 현황</div>
        <div class="sourceStatsTicker">
          <div class="sourceStatsTrack">
            <div class="sourceStatsLine">나라사랑가게 <strong id="countNara">0</strong>개</div>
            <div class="sourceStatsLine">병역명문가 <strong id="countMmg">0</strong>개</div>
            <div class="sourceStatsLine">나라사랑가게 <strong id="countNaraDup">0</strong>개</div>
          </div>
        </div>
      </div>
      <button id="profileBtn" class="profileBtn" type="button" aria-label="즐겨찾기 메뉴"></button>
      <div id="favoritesPanel" class="favoritesPanel hidden">
        <div class="favoritesHeader">즐겨찾기 목록</div>
        <div id="favoritesList" class="favoritesList"></div>
      </div>
    </div>

    <aside id="newStorePanel" class="newStorePanel" aria-label="신규 등록 스토어">
      <div class="newStoreHead">
        신규 등록된 스토어 <strong id="newStoreTotalCount">0</strong>개
      </div>
      <div class="newStoreRollWrap">
        <div id="newStoreRollTrack" class="newStoreRollTrack"></div>
      </div>
    </aside>

    <div id="rankPanel" class="rankPanel collapsed">
      <div class="rankHead">
        <span class="liveBadge">실시간</span>
        <span id="rankTopText" class="rankTopText">#1 -</span>
        <span id="rankTopScore" class="rankTopScore">0</span>
      </div>
      <div class="rankTabs">
        <button type="button" class="rankTab active" data-rank-tab="popular">인기</button>
        <button type="button" class="rankTab" data-rank-tab="likes">좋아요</button>
        <button type="button" class="rankTab" data-rank-tab="favorites">즐겨찾기</button>
      </div>
      <div id="rankAudienceFilters" class="rankAudienceFilters"></div>
      <div id="rankList" class="rankList"></div>
    </div>

    <div class="mapTools" aria-label="지도 도구 모음">
      <button id="btnLocate" type="button" class="toolBtn locate">내위치</button>
      <button id="btnZoomOut" type="button" class="toolBtn zoom">-</button>
      <button id="btnZoomIn" type="button" class="toolBtn zoom">+</button>
      <button id="btnZoomLevel" type="button" class="toolBtn level">16단계</button>
    </div>

    <div id="detailPanel" class="detailPanel hidden"></div>

    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
