<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나라사랑가게 홍보물 - 스카이 디자인</title>
  <script src="./config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;800;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #eaf4fb; font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; }

    /* The provided design image is used as the artwork; only the dynamic
       parts (store name / QR / benefit list / audience) are overlaid on top. */
    .sheet {
      position: relative;
      width: 1000px;
      height: 1414px;
      overflow: hidden;
      background: #cceaf7;
    }
    .base {
      position: absolute;
      inset: 0;
      width: 1000px;
      height: 1414px;
      display: block;
      z-index: 0;
      -webkit-user-drag: none;
    }

    /* --- store name (covers the sample pill exactly) --- */
    .name-pill {
      position: absolute;
      left: 500px;
      top: 656.5px;
      transform: translateX(-50%);
      height: 101.5px;
      min-width: 543px;
      max-width: 800px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 24px;
      border-radius: 999px;
      background: #003669;
      color: #ffffff;
      font-size: 44px;
      font-weight: 900;
      letter-spacing: -1.5px;
      z-index: 3;
    }
    .name-pill .dot { width: 14px; height: 14px; border-radius: 50%; background: #ffffff; flex: 0 0 auto; }
    .name-pill .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* --- QR (inside the empty white box of the artwork) --- */
    .qr {
      position: absolute;
      left: 132px;
      top: 853px;
      width: 195px;
      height: 196px;
      display: block;
      z-index: 2;
    }

    /* --- benefit list (covers the sample checklist area only) --- */
    .cover {
      position: absolute;
      left: 386px;
      top: 759px;
      width: 530px;
      height: 414px;
      background: #cceaf7;
      border-top-right-radius: 28px;
      border-bottom-right-radius: 28px;
      display: flex;
      flex-direction: column;
      /* 아트워크의 "상세내역 보기" 줄과 첫 혜택 줄을 항상 맞춘다 */
      padding: 26px 10px 12px 4px;
      overflow: hidden;
      z-index: 2;
    }
    .checks { flex: 0 0 auto; display: flex; flex-direction: column; gap: 22px; }
    .check { display: flex; align-items: flex-start; gap: 14px; }
    .check svg { flex: 0 0 auto; width: 34px; height: 34px; margin-top: 3px; }
    .check .txt {
      font-size: 28px;
      font-weight: 900;
      color: #133a72;
      line-height: 1.35;
      letter-spacing: -1px;
      word-break: keep-all;
      overflow-wrap: anywhere;
      text-wrap: pretty;
    }
    .check .sub {
      font-size: 19px;
      font-weight: 700;
      color: #2c6bab;
      margin-top: 4px;
      line-height: 1.35;
      letter-spacing: -0.5px;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    .more { flex: 0 0 auto; margin-top: auto; text-align: center; font-size: 26px; line-height: 0.7; color: #2c6bab; letter-spacing: 2px; margin-bottom: 10px; }
    .audience {
      flex: 0 0 auto;
      font-size: 26px;
      font-weight: 900;
      color: #133a72;
      letter-spacing: -1px;
      line-height: 1.3;
      word-break: keep-all;
      overflow-wrap: anywhere;
      padding-left: 28px;
    }

    @media print {
      html, body { background: #ffffff; }
    }
  </style>
</head>
<body>
  <div class="sheet" id="sheet">
    <img class="base" src="./img/design_base.png" alt="나라사랑가게 홍보물 배경">

    <div class="name-pill">
      <span class="dot"></span>
      <span class="name" id="storeName">가맹점 이름</span>
      <span class="dot"></span>
    </div>

    <img class="qr" id="qrImg" alt="QR">

    <div class="cover">
      <div class="checks" id="checkList"></div>
      <div class="more" id="moreDots">⋮</div>
      <div class="audience" id="audienceText">혜택대상 : 전국 병역명문가 본인 및 가족, 병무청 직원</div>
    </div>
  </div>

  <script>
    const CHECK_SVG = '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="#133a72"></circle><path d="M9 16.5 L13.6 21 L23 11.5" fill="none" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>';

    function splitInlineNumberedItems(line) {
      const re = /(^|\s)(\d{1,2})[.)]\s+/g;
      const items = [];
      let m;
      while ((m = re.exec(line)) !== null) items.push({ num: parseInt(m[2], 10), start: m.index + m[1].length });
      if (items.length < 2 || !items.every((it, i) => it.num === i + 1)) return [line];
      const parts = [];
      const head = line.slice(0, items[0].start).trim();
      if (head) parts.push(head);
      items.forEach((it, i) => {
        const end = i + 1 < items.length ? items[i + 1].start : line.length;
        parts.push(line.slice(it.start, end).trim());
      });
      return parts.filter(Boolean);
    }

    // "A 20% 할인 / B 15% 할인 / C 20% 할인" 처럼 슬래시로 이어진 항목을 나눈다.
    // "입/비급여"처럼 짧은 조각은 다시 붙여서 단어가 쪼개지지 않게 한다.
    function splitSlashItems(line) {
      const parts = line.split(/\s*\/\s*/);
      if (parts.length < 2) return [line];
      const out = [];
      let buf = "";
      for (const p of parts) {
        if (!buf) { buf = p; continue; }
        if ([...buf].length < 4) { buf = `${buf}/${p}`; continue; }
        out.push(buf);
        buf = p;
      }
      if (buf) out.push(buf);
      if (out.length > 1 && [...out[out.length - 1]].length < 4) {
        out[out.length - 2] = `${out[out.length - 2]}/${out.pop()}`;
      }
      return out;
    }

    // 줄 앞에 남는 머리기호(❍, ※, ☞ …)와 공백을 반복해서 제거한다.
    // 데이터에 기호가 겹쳐 들어오는 경우가 있어 더 이상 줄지 않을 때까지 돌린다.
    function stripMarks(line) {
      let out = String(line);
      let prev = "";
      while (out !== prev) {
        prev = out;
        out = out
          .replace(/^[\s\u00a0\u3000]+/, "")
          .replace(/^[-*·•○◦◯❍□■▢▣▶▷▸►▪▫ㅇ❖◇◆☞☛※＊×✓✔√⦁‣⁃–—]+\s*/, "")
          .replace(/^[oO]\s+/, "")
          .trim();
      }
      return out;
    }

    function benefitLines(raw) {
      return String(raw || "")
        .replace(/<\s*br\s*\/?\s*>/gi, "\n")
        .replace(/<[^>]+>/g, " ")
        .split("\n")
        .map((l) => l.replace(/\s+/g, " ").trim())
        .filter(Boolean)
        .flatMap(splitInlineNumberedItems)
        .flatMap(splitSlashItems)
        .map(stripMarks)
        .filter(Boolean);
    }

    function parseAudience(raw) {
      let audience = "";
      String(raw || "").replace(/<\s*br\s*\/?\s*>/gi, "\n").split("\n").forEach((line) => {
        const n = line.replace(/\s+/g, " ").trim();
        if (/세부\s*우대\s*대상/.test(n) || /^우대\s*대상/.test(n)) {
          audience = n.replace(/^세부\s*우대\s*대상\s*[:：]?\s*/, "").replace(/^우대\s*대상\s*[:：]?\s*/, "").trim();
        }
      });
      return audience;
    }

    function renderChecks(lines) {
      const bullets = lines.slice(0, 3);
      let extra = lines[3] || "";
      // 마지막 항목 끝에 붙은 "(...)" 설명은 보조 줄로 내려서 본문을 짧게 유지
      const last = bullets[bullets.length - 1];
      if (!extra && last) {
        const m = last.match(/\(([^()]{8,})\)\s*$/);
        if (m) {
          bullets[bullets.length - 1] = last.slice(0, m.index).trim().replace(/[,·]\s*$/, "");
          extra = m[0].trim();
        }
      }
      document.getElementById("checkList").innerHTML = bullets.map((b, i) => `
        <div class="check">
          ${CHECK_SVG}
          <div>
            <div class="txt">${b}</div>
            ${i === bullets.length - 1 && extra ? `<div class="sub">${extra}</div>` : ""}
          </div>
        </div>`).join("");
      document.getElementById("moreDots").style.visibility = lines.length > 4 ? "visible" : "hidden";
      fitChecksToBox();
    }

    // 혜택 내용이 박스를 넘치면 뒤쪽 항목부터 글자를 잘라(..) 박스 안에 맞춘다.
    // 혜택대상 줄은 언제나 박스 안쪽 하단에 남는다.
    function shortenTo(str, len) {
      const s = String(str);
      if (len >= s.length) return s;
      const cut = s.slice(0, Math.max(0, len)).trimEnd().replace(/[\s,·/\-–()]+$/, "");
      return cut ? `${cut}..` : "..";
    }

    function fitTo(el, ok) {
      if (ok()) return;
      const full = el.textContent;
      let lo = 0;
      let hi = full.length;
      let best = null;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        el.textContent = shortenTo(full, mid);
        if (ok()) { best = el.textContent; lo = mid + 1; } else { hi = mid - 1; }
      }
      el.textContent = best === null ? shortenTo(full, 0) : best;
    }

    function fitChecksToBox() {
      const cover = document.querySelector(".cover");
      const list = document.getElementById("checkList");
      const aud = document.getElementById("audienceText");
      const more = document.getElementById("moreDots");
      if (!cover || !list || !aud) return;

      const cs = getComputedStyle(cover);
      const limit = cover.getBoundingClientRect().bottom - parseFloat(cs.paddingBottom);
      // flex 로 줄어든 높이가 아니라 실제로 필요한 높이를 써야 한다
      const audH = Math.max(aud.getBoundingClientRect().height, aud.scrollHeight);
      const moreH = more ? Math.max(more.getBoundingClientRect().height, more.scrollHeight) + 10 : 0;
      const avail = limit - audH - moreH - list.getBoundingClientRect().top;
      const fits = () => list.getBoundingClientRect().height <= avail + 1;

      const items = [...list.querySelectorAll(".check")];
      for (let i = items.length - 1; i >= 0 && !fits(); i--) {
        const item = items[i];
        const txt = item.querySelector(".txt");
        const sub = item.querySelector(".sub");
        if (!txt || !txt.textContent.trim()) { item.remove(); continue; }
        if (sub) {
          sub.style.display = "none";
          const mainAloneFits = fits();
          sub.style.display = "";
          if (mainAloneFits) {
            fitTo(sub, fits);
            if (sub.textContent === "..") sub.remove();
            if (fits()) continue;
            if (sub.isConnected) sub.remove();
          } else {
            sub.remove();
          }
        }
        fitTo(txt, fits);
        if (!fits()) item.remove();
      }
    }

    async function init() {
      const params = new URLSearchParams(location.search);
      const facilityId = params.get("facility_id") || "nara_3218";

      try {
        const res = await fetch("./data/benefits_map.json");
        const data = await res.json();
        const facilities = data.facilities || [];
        const store = facilities.find((f) => f.facility_id === facilityId || f.id === facilityId) || facilities[0];

        if (store) {
          document.getElementById("storeName").textContent = store.name || "가맹점";
          // 혜택대상을 먼저 넣어야 한다: renderChecks 의 박스 맞춤이 혜택대상 높이를 빼고 계산한다
          const aud = parseAudience(store.benefit) || (Array.isArray(store.audiences) ? store.audiences.join(", ") : "");
          document.getElementById("audienceText").textContent = `혜택대상 : ${aud || "병역명문가"}`;
          renderChecks(benefitLines(store.benefit));
        }

        const isLocal = location.hostname === "localhost" || location.hostname === "127.0.0.1";
        const qrBase = isLocal ? location.origin : "https://mmamap-seven.vercel.app";
        const qrTarget = `${qrBase}/mobile_landing.html?facility_id=${encodeURIComponent(facilityId)}&src=design`;
        document.getElementById("qrImg").src =
          `https://api.qrserver.com/v1/create-qr-code/?size=1000x1000&data=${encodeURIComponent(qrTarget)}`;
      } catch (err) {
        console.error("design template init error:", err);
      }

      window.__MAP_READY = true;
      if (window.parent && window.parent.postMessage) window.parent.postMessage({ type: "MMA_MAP_READY" }, "*");
    }

    // Download size = the sample artwork size (A4 @ 600dpi) plus a trim bleed.
    // BLEED_MM is added to EACH SIDE, so the width/height each grow by 2×BLEED_MM.
    const POSTER_W = 4961;   // sample artwork width  (A4 210mm @ 600dpi)
    const POSTER_H = 7017;   // sample artwork height (A4 297mm @ 600dpi)
    const DPI = 600;
    const BLEED_MM = 2;      // 2mm per side -> +4mm on width and +4mm on height

    window.downloadPosterImage = async function (filename = "나라사랑가게_홍보물.png") {
      const sheet = document.getElementById("sheet");
      if (!sheet) return;
      try {
        // Render the sheet at the artwork's native resolution so nothing is upscaled.
        const scale = POSTER_W / sheet.offsetWidth;
        const rendered = await html2canvas(sheet, {
          scale,
          useCORS: true,
          allowTaint: true,
          backgroundColor: "#cceaf7",
          logging: false
        });

        const bleed = Math.round((BLEED_MM * DPI) / 25.4);
        const w = rendered.width;
        const h = rendered.height;

        const out = document.createElement("canvas");
        out.width = POSTER_W + bleed * 2;
        out.height = POSTER_H + bleed * 2;
        const ctx = out.getContext("2d");

        // 1) the poster itself, drawn at the exact target size
        ctx.drawImage(rendered, 0, 0, w, h, bleed, bleed, POSTER_W, POSTER_H);

        // 2) bleed area: extend the outermost pixels of the artwork outward
        ctx.drawImage(rendered, 0, 0, 1, h, 0, bleed, bleed, POSTER_H);                                        // left
        ctx.drawImage(rendered, w - 1, 0, 1, h, bleed + POSTER_W, bleed, bleed, POSTER_H);                     // right
        ctx.drawImage(rendered, 0, 0, w, 1, bleed, 0, POSTER_W, bleed);                                        // top
        ctx.drawImage(rendered, 0, h - 1, w, 1, bleed, bleed + POSTER_H, POSTER_W, bleed);                     // bottom
        ctx.drawImage(rendered, 0, 0, 1, 1, 0, 0, bleed, bleed);                                               // corners
        ctx.drawImage(rendered, w - 1, 0, 1, 1, bleed + POSTER_W, 0, bleed, bleed);
        ctx.drawImage(rendered, 0, h - 1, 1, 1, 0, bleed + POSTER_H, bleed, bleed);
        ctx.drawImage(rendered, w - 1, h - 1, 1, 1, bleed + POSTER_W, bleed + POSTER_H, bleed, bleed);

        const link = document.createElement("a");
        link.download = filename;
        link.href = out.toDataURL("image/png");
        link.click();
      } catch (e) {
        console.error("poster capture failed:", e);
        window.print();
      }
    };

    window.printPoster = function () { window.print(); };

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
